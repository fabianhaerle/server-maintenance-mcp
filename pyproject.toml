[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-maintenance-mcp"
version = "0.1.0"
description = "Read-only MCP server for server maintenance with built-in privacy redaction"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
server-maintenance-mcp = "server_maintenance_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
